<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CampusFlow — Student Intelligence Hub</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app-header{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850}
.brand-icon{width:38px;height:38px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.nav{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:#6b7280;padding:9px 16px;border-radius:9px;font-weight:750;cursor:pointer}
.tab.active{background:#111;color:#fff}
.live{font-size:12px;font-weight:700;color:#15803d;background:#f0fdf4;padding:8px 12px;border-radius:20px}
.content{height:calc(100vh - 72px);width:100%;position:relative}
.panel{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f7f8fa}
.panel.active{display:block}
@media(max-width:700px){.app-header{padding:0 10px}.brand span,.live{display:none}.tab{padding:8px 10px;font-size:12px}}
</style>
</head>

<header class="app-header">
